name: Test Released Package

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version/tag to test (e.g., v1.4.33)'
        required: true
        type: string

jobs:
  test-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Continue with other OS tests even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
    
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'  # Matching the engine requirement
          registry-url: 'https://npm.pkg.github.com'
          scope: '@shardus'

      - name: Create Test Project
        shell: bash
        run: |
          mkdir test-project
          cd test-project
          echo '{
            "name": "test-project",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@shardus/net": "${{ inputs.version_tag }}"
            }
          }' > package.json
          
          # Create test file
          echo 'const shardusNet = require("@shardus/net");
          console.log("Successfully imported @shardus/net");
          console.log("Module exports:", Object.keys(shardusNet));' > test.js

          # Create npm config to prevent fallback to build
          echo 'node-pre-gyp-only=true' > .npmrc

      - name: Install Package
        working-directory: test-project
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_node_pre_gyp_only: "true"  # Prevent fallback to build
          NPM_CONFIG_LOGLEVEL: "verbose"  # Get detailed logs
        run: |
          # Start timing
          INSTALL_START=$(date +%s)
          
          # Capture npm install output
          NPM_OUTPUT=$(npm install 2>&1)
          NPM_EXIT_CODE=$?
          
          # End timing
          INSTALL_END=$(date +%s)
          INSTALL_DURATION=$((INSTALL_END-INSTALL_START))
          
          # Echo the full output for logs
          echo "$NPM_OUTPUT"
          
          # Check for compilation indicators in the output
          if echo "$NPM_OUTPUT" | grep -iE "cargo|rustc|building|compiling" > /dev/null; then
            echo "❌ Error: Detected compilation-related messages in npm output"
            exit 1
          fi
          
          # Check for node-pre-gyp download indicators
          if ! echo "$NPM_OUTPUT" | grep -iE "downloaded|tarball|prebuilt" > /dev/null; then
            echo "❌ Error: No indication of prebuilt binary download found"
            exit 1
          fi
          
          # Check installation time (more than 30 seconds might indicate compilation)
          if [ $INSTALL_DURATION -gt 30 ]; then
            echo "❌ Warning: Installation took $INSTALL_DURATION seconds, which is suspicious for a prebuilt binary"
            echo "Full npm output:"
            echo "$NPM_OUTPUT"
            exit 1
          fi
          
          # Check the npm install exit code
          if [ $NPM_EXIT_CODE -ne 0 ]; then
            echo "❌ Error: Installation failed with exit code $NPM_EXIT_CODE"
            exit 1
          fi
          
          echo "✅ Package installed successfully in $INSTALL_DURATION seconds"
          echo "✅ Verified prebuilt binary was downloaded (not compiled)"

      - name: Verify Installation Method
        working-directory: test-project
        shell: bash
        run: |
          # Look for node-pre-gyp logs that indicate download vs build
          if [ -f "node_modules/@shardus/net/npm-debug.log" ]; then
            if grep -i "build" "node_modules/@shardus/net/npm-debug.log"; then
              echo "❌ Error: Found build-related messages in npm debug log"
              exit 1
            fi
          fi
          
          # Check for any cargo/rust artifacts
          if find . -type f -name "Cargo.lock" -o -name "target" -o -name ".cargo" | grep .; then
            echo "❌ Error: Found Rust/Cargo artifacts suggesting compilation"
            exit 1
          fi
          
          # Verify the binary was downloaded from the correct release
          EXPECTED_URL="https://github.com/BelfordZ/lib-net/releases/download/v${{ inputs.version_tag }}"
          if ! grep -r "$EXPECTED_URL" node_modules/@shardus/net/; then
            echo "❌ Error: No evidence of download from correct release URL"
            exit 1
          fi

      - name: Verify No Build Artifacts
        working-directory: test-project
        shell: bash
        run: |
          # Check for any build artifacts that would indicate compilation
          if [ -d "node_modules/@shardus/net/build" ]; then
            echo "❌ Error: Build directory found, suggesting compilation occurred"
            exit 1
          fi
          
          if [ -f "node_modules/@shardus/net/build.log" ]; then
            echo "❌ Error: Build log found, suggesting compilation occurred"
            exit 1
          fi

      - name: Verify Binary Installation
        working-directory: test-project
        shell: bash
        run: |
          echo "Checking for prebuilt binary..."
          ls -R node_modules/@shardus/net/native
          
          # Verify we have the correct platform binary
          if [ ! -f "node_modules/@shardus/net/native/${{ matrix.platform }}-x64/shardus-net.node" ]; then
            echo "❌ Error: Platform-specific binary not found!"
            exit 1
          fi
          
          echo "✅ Correct prebuilt binary found"

      - name: Test Import
        working-directory: test-project
        run: node test.js

      - name: Report Success
        shell: bash
        run: |
          echo "✅ Successfully tested @shardus/net ${{ inputs.version_tag }} on ${{ matrix.platform }}"
          echo "   ✓ Package installed WITHOUT any compilation"
          echo "   ✓ No Rust toolchain present during installation"
          echo "   ✓ No build artifacts found (pure prebuilt binary usage)"
          echo "   ✓ Correct platform-specific binary present"
          echo "   ✓ Module successfully imported and tested" 