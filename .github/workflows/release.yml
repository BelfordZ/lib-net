name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ env.NEW_VERSION }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-node@v3

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          npm version ${{ github.event.inputs.version_type }} -m "Release %s"
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Push changes
        run: git push --follow-tags

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.NEW_VERSION }}
          release_name: Release v${{ env.NEW_VERSION }}
          body: Release v${{ env.NEW_VERSION }}
          draft: false
          prerelease: false

  build-typescript:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: v${{ needs.create-release.outputs.new_version }}
      
      - uses: actions/setup-node@v3
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build-node
      
      - name: Create package
        run: |
          tar -czf typescript-build.tar.gz \
            package.json \
            README.md \
            build/ \
            src/ \
            Cargo.* \
            shardus_net/ \
            crypto/ \
            shardeum_utils/ \
            scripts/ \
            native/
      
      - name: Upload TypeScript build
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./typescript-build.tar.gz
          asset_name: typescript-build.tar.gz
          asset_content_type: application/gzip

  build-native:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
    steps:
      - uses: actions/checkout@v3
        with:
          ref: v${{ needs.create-release.outputs.new_version }}
      
      - uses: actions/setup-node@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install System Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq build-essential pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "native-build"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build-rust-release
        
      - name: Rebuild native module
        run: npx node-pre-gyp rebuild
        
      - name: Package binary
        run: npm run package-binary
        
      - name: Upload binary to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/stage/*.tar.gz
          asset_name: shardus-net-${{ matrix.platform }}.tar.gz
          asset_content_type: application/gzip 